name: Diex app release

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: Twenty target URL
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy-and-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy private Diex app
        uses: ./.github/actions/deploy-twenty-app
        with:
          api-url: ${{ inputs.target_url }}
          api-key: ${{ secrets.TWENTY_DEPLOY_API_KEY }}
          app-path: packages/twenty-apps/internal/diex

      - name: Install or upgrade Diex app
        uses: ./.github/actions/install-twenty-app
        with:
          api-url: ${{ inputs.target_url }}
          api-key: ${{ secrets.TWENTY_DEPLOY_API_KEY }}
          app-path: packages/twenty-apps/internal/diex
