name: Diex CRM image

on:
  workflow_dispatch:
  push:
    tags:
      - "diex-v*"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#diex-v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid Diex release version: $version" >&2
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/twenty-diex
          tags: |
            type=sha,prefix=sha-
            type=ref,event=tag

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/twenty-docker/twenty/Dockerfile
          target: twenty
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            APP_VERSION=${{ steps.version.outputs.value }}
            DIEX_CORE_BUILD_VERSION=${{ steps.version.outputs.value }}

  # Pushing a diex-v* tag is the whole release. Nobody sets the image tag by
  # hand in Coolify: the tag that produced the image is the tag that gets
  # deployed, so the two can never drift.
  #
  # Gated on the DIEX_DEPLOY_FROM_CI variable because the Coolify API is only
  # published on port 8000 behind an IP allowlist, and GitHub-hosted runners
  # egress from a range too large and too volatile to allowlist. Until Coolify
  # answers on a routable address, the tag builds and publishes the image and
  # the deploy is driven by hand. Skipping keeps that fact visible instead of
  # painting every release red. Set the variable to "true" once the API is
  # reachable — the steps below need no other change.
  deploy:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/diex-v') && vars.DIEX_DEPLOY_FROM_CI == 'true'
    runs-on: ubuntu-latest
    environment: homologation
    concurrency:
      group: diex-deploy-homologation
      cancel-in-progress: false
    env:
      COOLIFY_URL: ${{ secrets.COOLIFY_API_URL }}
      COOLIFY_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
      SERVER_UUID: lzgjig7ausbrgdkzemopj4ng
      WORKER_UUID: nes5rib9mpbv3f0y82wez8in
      TARGET_URL: https://next-crm.bydiex.com
    steps:
      # Both applications are Coolify "dockerimage" resources, so the image
      # they run is the docker_registry_image_tag field on the application
      # itself — not an environment variable the container reads. Patching an
      # env var here would report success and deploy the previous image.
      - name: Point server and worker at the new image
        shell: bash
        run: |
          set -euo pipefail

          for uuid in "$SERVER_UUID" "$WORKER_UUID"; do
            curl --fail-with-body --silent --show-error \
              -X PATCH "${COOLIFY_URL}/api/v1/applications/${uuid}" \
              -H "Authorization: Bearer ${COOLIFY_TOKEN}" \
              -H 'Content-Type: application/json' \
              -d "$(jq -nc --arg v "$GITHUB_REF_NAME" \
                    '{docker_registry_image_tag:$v}')" \
              >/dev/null

            applied=$(curl --fail-with-body --silent --show-error \
              "${COOLIFY_URL}/api/v1/applications/${uuid}" \
              -H "Authorization: Bearer ${COOLIFY_TOKEN}" \
              | jq -r '.docker_registry_image_tag')

            if [[ "$applied" != "$GITHUB_REF_NAME" ]]; then
              echo "::error::${uuid} still pinned to '${applied}'"
              exit 1
            fi

            echo "::notice::${uuid} -> ${GITHUB_REF_NAME}"
          done

      - name: Trigger the deploy
        shell: bash
        run: |
          set -euo pipefail

          curl --fail-with-body --silent --show-error \
            "${COOLIFY_URL}/api/v1/deploy?uuid=${SERVER_UUID},${WORKER_UUID}&force=false" \
            -H "Authorization: Bearer ${COOLIFY_TOKEN}" \
            | jq -r '.deployments[].deployment_uuid' > deployments.txt

          test -s deployments.txt

      - name: Wait for Coolify to finish
        shell: bash
        run: |
          set -euo pipefail

          while read -r deployment; do
            for attempt in $(seq 1 120); do
              status=$(curl --silent --show-error \
                "${COOLIFY_URL}/api/v1/deployments/${deployment}" \
                -H "Authorization: Bearer ${COOLIFY_TOKEN}" | jq -r '.status // "unknown"')

              case "$status" in
                finished)
                  echo "::notice::${deployment} finished"
                  break
                  ;;
                failed|cancelled-by-user)
                  echo "::error::deployment ${deployment} ended as ${status}"
                  exit 1
                  ;;
              esac

              if [[ "$attempt" -eq 120 ]]; then
                echo "::error::deployment ${deployment} still ${status} after 20 minutes"
                exit 1
              fi

              sleep 10
            done
          done < deployments.txt

      # Coolify reporting "finished" only means the container started. The boot
      # runs metadata migrations and can take several minutes more, so the
      # release is not green until the running instance answers with this
      # version.
      - name: Verify the running version
        shell: bash
        run: |
          set -euo pipefail

          expected="${GITHUB_REF_NAME#diex-v}"
          actual=""

          for _ in $(seq 1 60); do
            actual=$(curl --silent --max-time 10 "${TARGET_URL}/client-config" \
              | grep -o '"appVersion":"[^"]*"' | head -1 | cut -d'"' -f4 || true)

            if [[ "$actual" == "$expected" ]]; then
              echo "::notice::${TARGET_URL} is serving ${actual}"
              exit 0
            fi

            sleep 15
          done

          echo "::error::expected ${expected}, still serving '${actual:-unreachable}'"
          exit 1
