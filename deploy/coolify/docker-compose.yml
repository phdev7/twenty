name: diex-crm

x-diex-environment: &diex-environment
  NODE_ENV: production
  SERVER_URL: ${SERVER_URL}
  PG_DATABASE_URL: ${PG_DATABASE_URL}
  REDIS_URL: ${REDIS_URL}
  ENCRYPTION_KEY: ${ENCRYPTION_KEY}
  FALLBACK_ENCRYPTION_KEY: ${FALLBACK_ENCRYPTION_KEY:-}
  APP_SECRET: ${APP_SECRET:-}
  IS_MULTIWORKSPACE_ENABLED: "true"
  IS_WORKSPACE_CREATION_LIMITED_TO_SERVER_ADMINS: "true"
  IS_BILLING_ENABLED: "false"
  SIGN_IN_PREFILLED: "false"
  ANALYTICS_ENABLED: "false"
  AUTH_PASSWORD_ENABLED: "true"
  IS_EMAIL_VERIFICATION_REQUIRED: ${IS_EMAIL_VERIFICATION_REQUIRED:-true}
  STORAGE_TYPE: ${STORAGE_TYPE:-local}
  STORAGE_LOCAL_PATH: ${STORAGE_LOCAL_PATH:-/app/packages/twenty-server/.local-storage}
  STORAGE_S3_REGION: ${STORAGE_S3_REGION:-}
  STORAGE_S3_NAME: ${STORAGE_S3_NAME:-}
  STORAGE_S3_ENDPOINT: ${STORAGE_S3_ENDPOINT:-}
  STORAGE_S3_ACCESS_KEY_ID: ${STORAGE_S3_ACCESS_KEY_ID:-}
  STORAGE_S3_SECRET_ACCESS_KEY: ${STORAGE_S3_SECRET_ACCESS_KEY:-}
  EMAIL_DRIVER: ${EMAIL_DRIVER:-LOGGER}
  EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-crm@bydiex.com}
  EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-Diex}
  EMAIL_SMTP_HOST: ${EMAIL_SMTP_HOST:-}
  EMAIL_SMTP_PORT: ${EMAIL_SMTP_PORT:-587}
  EMAIL_SMTP_USER: ${EMAIL_SMTP_USER:-}
  EMAIL_SMTP_PASSWORD: ${EMAIL_SMTP_PASSWORD:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  AI_MODELS_DEFAULT_FAST: ${AI_MODELS_DEFAULT_FAST:-openai/gpt-5-mini}
  AI_MODELS_DEFAULT_SMART: ${AI_MODELS_DEFAULT_SMART:-openai/gpt-5.2}
  OUTBOUND_HTTP_SAFE_MODE_ENABLED: "true"
  DIEX_EVOLUTION_ALLOWED_ORIGINS: ${DIEX_EVOLUTION_ALLOWED_ORIGINS:-}
  DIEX_EVOLUTION_ALLOW_PRIVATE_NETWORK: ${DIEX_EVOLUTION_ALLOW_PRIVATE_NETWORK:-false}
  DIEX_MIGRATION_API_ENABLED: ${DIEX_MIGRATION_API_ENABLED:-false}
  LOG_LEVELS: ${LOG_LEVELS:-error,warn}

x-diex-runtime: &diex-runtime
  image: ${DIEX_IMAGE}:${DIEX_IMAGE_TAG}
  pull_policy: always
  restart: unless-stopped

services:
  server:
    <<: *diex-runtime
    volumes:
      - diex-local-storage:/app/packages/twenty-server/.local-storage
    environment:
      <<: *diex-environment
      NODE_PORT: 3000
      DISABLE_DB_MIGRATIONS: "false"
      DISABLE_CRON_JOBS_REGISTRATION: "false"
    expose:
      - "3000"
    labels:
      - "coolify.managed=true"
      - "traefik.enable=true"
      - "traefik.http.middlewares.${DIEX_PROXY_ROUTER}-auth.basicauth.removeheader=true"
      - "traefik.http.middlewares.${DIEX_PROXY_ROUTER}-auth.basicauth.users=${DIEX_BASIC_AUTH_USERS:-}"
      - "traefik.http.middlewares.${DIEX_PROXY_ROUTER}-noindex.headers.customresponseheaders.X-Robots-Tag=${DIEX_ROBOTS_POLICY:-noindex,nofollow,noarchive}"
      - "traefik.http.middlewares.${DIEX_PROXY_ROUTER}-redirect.redirectscheme.scheme=https"
      - "traefik.http.routers.${DIEX_PROXY_ROUTER}-http.entrypoints=http"
      - "traefik.http.routers.${DIEX_PROXY_ROUTER}-http.middlewares=${DIEX_PROXY_ROUTER}-redirect"
      - "traefik.http.routers.${DIEX_PROXY_ROUTER}-http.rule=Host(`${SERVER_HOST}`)"
      - "traefik.http.routers.${DIEX_PROXY_ROUTER}-http.service=${DIEX_PROXY_ROUTER}-service"
      - "traefik.http.routers.${DIEX_PROXY_ROUTER}-https.entrypoints=https"
      - "traefik.http.routers.${DIEX_PROXY_ROUTER}-https.middlewares=${DIEX_PROXY_MIDDLEWARES}"
      - "traefik.http.routers.${DIEX_PROXY_ROUTER}-https.rule=Host(`${SERVER_HOST}`)"
      - "traefik.http.routers.${DIEX_PROXY_ROUTER}-https.service=${DIEX_PROXY_ROUTER}-service"
      - "traefik.http.routers.${DIEX_PROXY_ROUTER}-https.tls=true"
      - "traefik.http.routers.${DIEX_PROXY_ROUTER}-https.tls.certresolver=letsencrypt"
      - "traefik.http.services.${DIEX_PROXY_ROUTER}-service.loadbalancer.server.port=3000"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:3000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 90s

  worker:
    <<: *diex-runtime
    command: ["yarn", "worker:prod"]
    volumes:
      - diex-local-storage:/app/packages/twenty-server/.local-storage
    environment:
      <<: *diex-environment
      DISABLE_DB_MIGRATIONS: "true"
      DISABLE_CRON_JOBS_REGISTRATION: "true"
    depends_on:
      server:
        condition: service_healthy

volumes:
  diex-local-storage:
